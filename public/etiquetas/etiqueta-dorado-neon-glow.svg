<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff275" />
      <stop offset="50%" stop-color="#ffbe1a" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
  </defs>

  <!-- Fondo oscuro carbón -->
  <rect x="6" y="6" width="308" height="78" rx="18" fill="#0c0c0b" />

  <!-- Marco Neón con resplandor -->
  <rect x="8" y="8" width="304" height="74" rx="16" fill="none" stroke="url(#neonGold)" stroke-width="2.5" filter="url(#neonGlow)" />

  <!-- Badge "CANCHA" tipo neón -->
  <rect x="24" y="26" width="28" height="38" rx="6" fill="#1e1805" stroke="#ffbe1a" stroke-width="1.2" />
  <path d="M 38 33 L 38 57 M 31 45 L 45 45" stroke="#ffe853" stroke-width="2" stroke-linecap="round" />

  <!-- Precio Neón -->
  <text x="66" y="54" font-family="'Impact', 'Arial Black', sans-serif" font-size="36" fill="#ffffff" letter-spacing="1">S/ <tspan fill="url(#neonGold)" filter="url(#neonGlow)">55</tspan></text>

  <!-- Tag "X HORA" deportivo -->
  <rect x="206" y="28" width="90" height="34" rx="8" fill="url(#neonGold)" />
  <text x="251" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="0.5">X HORA</text>
</svg>
