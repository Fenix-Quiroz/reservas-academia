<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="jaguarGoldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be" />
      <stop offset="35%" stop-color="#f6d98a" />
      <stop offset="70%" stop-color="#d29a14" />
      <stop offset="100%" stop-color="#996400" />
    </linearGradient>
    <linearGradient id="jaguarGoldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f6d98a" />
      <stop offset="100%" stop-color="#e4b339" />
    </linearGradient>
    <radialGradient id="darkBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2a2215" />
      <stop offset="70%" stop-color="#151412" />
      <stop offset="100%" stop-color="#0b0b0a" />
    </radialGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sombra exterior -->
  <rect x="7" y="7" width="306" height="76" rx="38" fill="rgba(0,0,0,0.5)" filter="url(#glow1)" />
  
  <!-- Fondo y borde -->
  <rect x="5" y="5" width="310" height="80" rx="40" fill="url(#darkBg)" stroke="url(#jaguarGoldBorder)" stroke-width="2.5" />

  <!-- Detalle decorativo izquierdo (punto dorado) -->
  <circle cx="36" cy="45" r="14" fill="#996400" opacity="0.3" />
  <circle cx="36" cy="45" r="8" fill="url(#jaguarGoldBorder)" />
  <circle cx="36" cy="45" r="3" fill="#ffffff" />

  <!-- Texto de Precio -->
  <text x="64" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#jaguarGoldText)" letter-spacing="0.5">S/ 55</text>
  
  <!-- Subtítulo "por hora" -->
  <rect x="180" y="30" width="112" height="30" rx="15" fill="rgba(228, 179, 57, 0.15)" stroke="#d29a14" stroke-width="1" />
  <text x="236" y="50" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f6d98a" text-anchor="middle" letter-spacing="0.5">LA HORA</text>
</svg>
