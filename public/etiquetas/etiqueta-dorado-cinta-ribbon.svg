<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#754a00" />
      <stop offset="15%" stop-color="#d29a14" />
      <stop offset="50%" stop-color="#fff0be" />
      <stop offset="85%" stop-color="#d29a14" />
      <stop offset="100%" stop-color="#754a00" />
    </linearGradient>
    <linearGradient id="ribbonDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241d13" />
      <stop offset="100%" stop-color="#0e0d0b" />
    </linearGradient>
    <filter id="ribbonShadow">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Puntas de cinta decorativas en los extremos -->
  <polygon points="12,18 28,45 12,72 32,72 44,45 32,18" fill="#5a3900" />
  <polygon points="308,18 292,45 308,72 288,72 276,45 288,18" fill="#5a3900" />

  <!-- Cuerpo central de la cinta -->
  <rect x="26" y="16" width="268" height="58" rx="8" fill="url(#ribbonDark)" stroke="url(#ribbonGold)" stroke-width="2.5" filter="url(#ribbonShadow)" />

  <!-- Líneas doradas superior e inferior -->
  <line x1="38" y1="23" x2="282" y2="23" stroke="url(#ribbonGold)" stroke-width="1" opacity="0.6" />
  <line x1="38" y1="67" x2="282" y2="67" stroke="url(#ribbonGold)" stroke-width="1" opacity="0.6" />

  <!-- Estrellas doradas -->
  <text x="50" y="49" font-size="14" fill="#f1c75b">★</text>
  <text x="262" y="49" font-size="14" fill="#f1c75b">★</text>

  <!-- Texto Central -->
  <text x="160" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="url(#ribbonGold)" text-anchor="middle" letter-spacing="1">
    S/ 55 <tspan font-size="14" font-weight="600" fill="#ffffff" letter-spacing="0">/ HORA</tspan>
  </text>
</svg>
