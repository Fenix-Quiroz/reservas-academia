<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Reserva tu campo en el Polideportivo El Jaguar</title>
  <desc id="descripcion">Imagen de un campo de fútbol con el texto Reserva tu campo y Polideportivo El Jaguar.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123b25" />
      <stop offset="100%" stop-color="#197a3c" />
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#092014" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#fondo)" />
  <circle cx="1040" cy="-20" r="230" fill="#ffffff" opacity="0.08" />
  <circle cx="1100" cy="580" r="180" fill="#ffffff" opacity="0.06" />

  <g filter="url(#sombra)" transform="translate(650 112)">
    <rect width="430" height="406" rx="28" fill="#2e9d4f" />
    <rect x="25" y="25" width="380" height="356" rx="14" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9" />
    <line x1="215" y1="25" x2="215" y2="381" stroke="#ffffff" stroke-width="6" opacity="0.9" />
    <circle cx="215" cy="203" r="67" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9" />
    <rect x="25" y="126" width="72" height="154" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9" />
    <rect x="333" y="126" width="72" height="154" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9" />
    <circle cx="215" cy="203" r="13" fill="#ffffff" />
  </g>

  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="165" font-size="30" font-weight="700" letter-spacing="3" opacity="0.78">POLIDEPORTIVO</text>
    <text x="90" y="255" font-size="72" font-weight="800">Reserva</text>
    <text x="90" y="335" font-size="72" font-weight="800">tu campo</text>
    <rect x="90" y="385" width="125" height="7" rx="3.5" fill="#8fe0a9" />
    <text x="90" y="445" font-size="34" font-weight="700">El Jaguar</text>
    <text x="90" y="505" font-size="24" opacity="0.82">Elige campo, fecha y horario</text>
  </g>
</svg>
